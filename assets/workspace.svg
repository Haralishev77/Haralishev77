 @keyframes typing{0%,8%{width:0}45%,100%{width:444px}} @keyframes travel{0%,8%{transform:translateX(0)}45%,100%{transform:translateX(444px)}} @keyframes blink{50%{opacity:0}} @keyframes glow{to{opacity:.4}}
